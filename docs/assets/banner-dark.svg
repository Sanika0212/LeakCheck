<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="LeakCheck: finds the work small contractors did but never billed">
  <rect width="1200" height="260" rx="18" fill="#1a1a19"/>
  <text x="56" y="112" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="62" font-weight="700" fill="#ffffff">LeakCheck</text>
  <text x="58" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c3c2b7">Finds the work small contractors did</text>
  <text x="58" y="188" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c3c2b7">but never billed, and drafts the invoice.</text>
  <rect x="690" y="46" width="450" height="176" rx="12" fill="#242422"/><text x="714" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff">Interior, 4 rooms</text><text x="1116" y="72" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#c3c2b7">$3,840</text><text x="714" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff">Exterior, 2 stories</text><text x="1116" y="110" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#c3c2b7">$9,120</text><rect x="700" y="128" width="430" height="30" rx="7" fill="#d03b3b" fill-opacity="0.12" stroke="#d03b3b" stroke-width="1.5"/><text x="714" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d03b3b">Garage door, asked for by text</text><text x="1116" y="148" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#d03b3b">$389</text><text x="1020" y="148" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#d03b3b">never billed</text><text x="714" y="186" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff">Cabinets, 28 doors</text><text x="1116" y="186" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#c3c2b7">$2,610</text>
</svg>
